<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Install HCL PUMP</title>

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#0f172a">

  <link rel="icon"
    href="https://zakhyzulfandi-coder.github.io/Rohis-Mutiara-Ilmu/LOGO-HCL.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
      color:white;
    }

    .card{
      width:360px;
      padding:35px;
      border-radius:28px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      text-align:center;
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .logo{
      width:110px;
      height:110px;
      border-radius:24px;
      background:white;
      padding:12px;
      margin-bottom:20px;
    }

    h1{
      margin-bottom:10px;
      font-size:36px;
    }

    p{
      line-height:1.6;
      opacity:0.9;
      margin-bottom:25px;
    }

    .btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:18px;
      background:white;
      color:#0f172a;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.03);
    }

  </style>
</head>

<body>

  <div class="card">

    <img class="logo"
      src="https://zakhyzulfandi-coder.github.io/Rohis-Mutiara-Ilmu/LOGO-HCL.png">

    <h1>HCL PUMP</h1>

    <p>
      Install aplikasi HCL PUMP sekarang untuk pengalaman fullscreen tanpa browser.
    </p>

    <button class="btn" id="installBtn">
      INSTALL SEKARANG
    </button>

  </div>

  <script>

    let deferredPrompt;

    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {

      e.preventDefault();

      deferredPrompt = e;

    });

    installBtn.addEventListener('click', async () => {

      if (deferredPrompt) {

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

      } else {

        alert(
          "Browser belum mendukung install otomatis atau aplikasi sudah terinstall."
        );

      }

    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }

  </script>

</body>
</html>
